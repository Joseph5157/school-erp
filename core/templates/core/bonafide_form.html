{% extends "base.html" %}
{% block title %}Bonafide certificate{% endblock %}
{% block content %}
<h1 class="h3 mb-3">Bonafide certificate</h1>
<p class="text-muted">Confirms that the student is currently enrolled. The certificate gets a serial number and the PDF opens next.</p>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Issue certificate</button>
    <a class="btn btn-link" href="{% url 'core:document-index' %}">Cancel</a>
</form>
{% endblock %}
