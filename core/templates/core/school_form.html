{% extends "base.html" %}
{% block title %}{% if creating %}Create school{% else %}Edit school{% endif %}{% endblock %}
{% block content %}
<h1 class="h3 mb-3">{% if creating %}Create school configuration{% else %}Edit school configuration{% endif %}</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Save</button>
</form>
{% endblock %}
