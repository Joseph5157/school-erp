{% extends "base.html" %}
{% block title %}{% if creating %}Add Term{% else %}Edit Term{% endif %}{% endblock %}
{% block content %}
<h1 class="h3 mb-3">{% if creating %}Add Term{% else %}Edit Term{% endif %} <small class="text-muted">{{ academic_year.name }}</small></h1>
<form method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Save term</button>
    <a class="btn btn-link" href="{% url 'core:academic-year-terms' academic_year.pk %}">Cancel</a>
</form>
{% endblock %}
