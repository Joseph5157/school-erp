{% extends "base.html" %}
{% block title %}Choose where to go{% endblock %}
{% block content %}
<div class="erp-auth">
    <h1>Where would you like to go?</h1>
    <p class="text-secondary">Your login has more than one role. You can switch at any time from the account menu.</p>
    <div class="erp-link-list">
        {% for key, label, url_name in areas %}
        <a class="erp-link-row" href="{% url url_name %}">
            <span class="erp-link-row-text"><span class="erp-link-row-title">{{ label }}</span></span>
        </a>
        {% endfor %}
    </div>
</div>
{% endblock %}
