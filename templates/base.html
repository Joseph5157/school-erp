<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}School ERP{% endblock %}</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand navbar-light bg-light mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'core:school-detail' %}">School ERP</a>
            <div class="navbar-nav">
                <a class="nav-link" href="{% url 'core:school-detail' %}">School</a>
                <a class="nav-link" href="{% url 'core:academic-year-list' %}">Academic Years</a>
                <a class="nav-link" href="{% url 'core:class-grade-list' %}">Classes/Grades</a>
            </div>
            <div class="navbar-nav ms-auto">
                {% if user.is_authenticated %}
                    <span class="navbar-text me-3">{{ user }}</span>
                    <form method="post" action="{% url 'logout' %}" class="d-inline">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-outline-secondary btn-sm">Log out</button>
                    </form>
                {% else %}
                    <a class="nav-link" href="{% url 'login' %}">Log in</a>
                {% endif %}
            </div>
        </div>
    </nav>
    <div class="container">
        {% for message in messages %}
            <div class="alert alert-info">{{ message }}</div>
        {% endfor %}
        {% block content %}{% endblock %}
    </div>
</body>
</html>
