{# Decorative tab icon; the visible text label always accompanies it. Expects `name`; optional `icon_class`. #}
<svg class="erp-tab-icon{% if icon_class %} {{ icon_class }}{% endif %}" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{% if name == "today" %}<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>
{% elif name == "students" %}<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 5.2a3.3 3.3 0 0 1 0 6.2M18 14.3c2.2.7 3.5 2.6 3.5 5.7"/>
{% elif name == "assessments" %}<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9zM8.5 13l2.2 2.2L15.5 10.5"/>
{% elif name == "results" %}<path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4M10 12h5M10 16h5"/>
{% endif %}</svg>
