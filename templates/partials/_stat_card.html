<article class="erp-stat-card erp-stat-card--{{ card.tone }}">
    <h2 class="erp-stat-label">{{ card.title }}</h2>
    <p class="erp-stat-value">{{ card.count }}</p>
    {% if card.count %}
    <p class="erp-stat-summary">{{ card.summary }}{% if card.detail %} {{ card.detail }}{% endif %}</p>
    {% else %}
    <p class="erp-stat-summary">Nothing waiting.{% if card.detail %} {{ card.detail }}{% endif %}</p>
    {% endif %}
    <a class="btn btn-outline-primary btn-sm mt-auto align-self-start" href="{{ card.url }}">Open<span class="visually-hidden"> {{ card.title }}</span></a>
</article>
