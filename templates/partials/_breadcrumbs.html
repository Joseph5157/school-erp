{% if breadcrumbs %}
<nav class="erp-breadcrumb" aria-label="Breadcrumb">
    <ol>
        {% for crumb in breadcrumbs %}
        <li>{% if forloop.last %}<a href="{{ request.path }}" aria-current="page">{{ crumb.label }}</a>{% else %}<a href="{{ crumb.url }}">{{ crumb.label }}</a>{% endif %}</li>
        {% endfor %}
    </ol>
</nav>
{% endif %}
