<div class="erp-field{% if field.errors %} is-invalid{% endif %}">
    {{ field.label_tag }}
    {% if field.field.required %}<span class="erp-required-mark" aria-hidden="true"> *</span><span class="visually-hidden"> (required)</span>{% endif %}
    {{ field }}
    {% if field.help_text %}<div class="erp-field-help" id="{{ field.auto_id }}_helptext">{{ field.help_text|safe }}</div>{% endif %}
    {% if field.errors %}
    <ul class="erp-field-errors" id="{{ field.auto_id }}_error">
        {% for error in field.errors %}<li>{{ error }}</li>{% endfor %}
    </ul>
    {% endif %}
</div>
