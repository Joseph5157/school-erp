{% extends "portal/base.html" %}
{% block title %}{{ notice.title }}{% endblock %}
{% block content %}
<h1 class="h3 mb-1">{{ notice.title }}</h1>
<p class="text-muted small">{{ notice.published_at|date:"j M Y" }}</p>
<div class="border rounded p-3 mb-3" style="max-width: 40rem">{{ notice.body|linebreaksbr }}</div>
<p><a href="{% url 'portal:notices' %}">All notices</a></p>
{% endblock %}
