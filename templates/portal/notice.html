{% extends "portal/base.html" %}
{% block title %}{{ notice.title }}{% endblock %}
{% block content %}
<header class="erp-child-head">
    <a class="erp-back" href="{% url 'portal:notices' %}">&larr; Notices</a>
    <h1 class="erp-child-title">{{ notice.title }}</h1>
    <p class="erp-child-meta">{{ notice.published_at|date:"j M Y" }}</p>
</header>
<div class="border rounded p-3 mb-3" style="max-width: 40rem">{{ notice.body|linebreaksbr }}</div>
{% endblock %}
