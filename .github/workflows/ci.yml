name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Docs-only PRs have nothing for these checks to catch.
    paths-ignore:
      - "docs/**"
      - "**/*.md"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install ruff==0.16.7
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
          POSTGRES_DB: erp
        ports:
          - 5432:5432
        # The test database is thrown away after each run, so it lives in memory.
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret
      DJANGO_DEBUG: "False"
      DB_NAME: erp
      DB_USER: erp
      DB_PASSWORD: erp
      DB_HOST: localhost
      DB_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      # WeasyPrint (PDF documents) needs Pango at import time.
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
      # Autovacuum can analyze a table while a test transaction is still filling it.
      # It cannot see those rows, so it records "0 rows", and the planner then picks
      # plans that make the seed-demo setups take many minutes. Some runs were hit and
      # some were not, depending on timing. This database is thrown away, so autovacuum
      # has nothing useful to do here.
      - name: Turn off autovacuum for the throwaway test database
        env:
          PGPASSWORD: erp
        run: |
          psql -h "$DB_HOST" -U "$DB_USER" -d postgres -c "ALTER SYSTEM SET autovacuum = off"
          psql -h "$DB_HOST" -U "$DB_USER" -d postgres -c "SELECT pg_reload_conf()"
          sleep 1
          psql -h "$DB_HOST" -U "$DB_USER" -d postgres -c "SHOW autovacuum"
      - name: Test suite (PostgreSQL)
        run: |
          pip install py-spy
          bash .github/scripts/report_test_stall.sh 420 300 &
          watcher=$!
          status=0
          python manage.py test --parallel 4 --durations 20 || status=$?
          kill "$watcher" 2>/dev/null || true
          exit "$status"
