name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install ruff==0.16.7
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
          POSTGRES_DB: erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret
      DJANGO_DEBUG: "False"
      DB_NAME: erp
      DB_USER: erp
      DB_PASSWORD: erp
      DB_HOST: localhost
      DB_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      # WeasyPrint (PDF documents) needs Pango at import time.
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
      - name: Test suite (PostgreSQL)
        run: python manage.py test --parallel 4
