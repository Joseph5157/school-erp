name: CI
# The run title shows the test mode, so the Actions list tells a draft-safety run from a full one.
run-name: >-
  CI (${{ (github.event_name == 'pull_request' && github.event.pull_request.draft) && 'draft safety' || 'full' }})

# Test mode (docs/engineering/IMPLEMENTATION_WORKFLOW.md, section 11):
# - Draft PR: lint, system check, migration check and a fixed safety-test set.
# - PR that is Ready for review, and every push to main: lint and the complete suite.
# Anything that is not a draft PR runs the complete suite.
on:
  push:
    branches: [main]
  pull_request:
    # ready_for_review starts the complete suite when a draft is marked Ready.
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
    # Docs-only PRs have nothing for these checks to catch.
    paths-ignore:
      - "docs/**"
      - "**/*.md"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install ruff==0.16.7
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
          POSTGRES_DB: erp
        ports:
          - 5432:5432
        # The test database is thrown away after each run, so it lives in memory.
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret
      DJANGO_DEBUG: "False"
      DB_NAME: erp
      DB_USER: erp
      DB_PASSWORD: erp
      DB_HOST: localhost
      DB_PORT: "5432"
      # "draft" only for a pull request that is a draft right now; everything else is "full".
      CI_MODE: ${{ (github.event_name == 'pull_request' && github.event.pull_request.draft) && 'draft' || 'full' }}
      # Draft safety set: route-permission inventory, permission and privacy guards, sessions,
      # deployment settings and this workflow's own policy. About 250 tests, under a minute.
      DRAFT_SAFETY_TESTS: >-
        core.tests.test_ci_policy
        core.tests.test_security_gate4b_route_inventory
        core.tests.test_test_settings
        core.tests.test_security_gate2_deployment_safety
        core.tests.test_security_gate4a_crash_email_privacy
        core.tests.test_security_gate1_account_protection
        core.tests.test_security_gate3a_academic_year_authorization
        core.tests.test_security_gate4b_bundles
        core.tests.test_security_gate4b_people_pages
        core.tests.test_security_gate4b_results_pages
        core.tests.test_security_gate4b_attendance_pages
        core.tests.test_security_gate4b_documents
        core.tests.test_security_gate4b_imports
        core.tests.test_phase6_security
        core.tests.test_session_errors_audit18
        core.tests.test_js_toolchain_boundary
        core.tests.test_js_fixture_contract
    steps:
      - name: Test mode
        run: |
          if [ "$CI_MODE" = "draft" ]; then
            label="draft safety"
            note="Draft PR: safety tests only. The complete suite runs when the PR is marked Ready for review."
          else
            label="full"
            note="Complete PostgreSQL suite."
          fi
          echo "Test mode: $label"
          echo "::notice title=Test mode: $label::$note"
          { echo "## Test mode: $label"; echo; echo "$note"; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      # WeasyPrint (PDF documents) needs Pango at import time.
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
      # Autovacuum can analyze a table while a test transaction is still filling it.
      # It cannot see those rows, so it records "0 rows", and the planner then picks
      # plans that make the seed-demo setups take many minutes. Some runs were hit and
      # some were not, depending on timing. This database is thrown away, so autovacuum
      # has nothing useful to do here.
      - name: Turn off autovacuum for the throwaway test database
        env:
          PGPASSWORD: erp
        run: |
          psql -h "$DB_HOST" -U "$DB_USER" -d postgres -c "ALTER SYSTEM SET autovacuum = off"
          psql -h "$DB_HOST" -U "$DB_USER" -d postgres -c "SELECT pg_reload_conf()"
          sleep 1
          psql -h "$DB_HOST" -U "$DB_USER" -d postgres -c "SHOW autovacuum"
      - name: Draft safety tests (PostgreSQL)
        if: env.CI_MODE == 'draft'
        run: python manage.py test $DRAFT_SAFETY_TESTS --parallel 4 --noinput
      - name: Test suite (PostgreSQL)
        if: env.CI_MODE != 'draft'
        run: |
          pip install py-spy
          bash .github/scripts/report_test_stall.sh 420 300 &
          watcher=$!
          status=0
          python manage.py test --parallel 4 --durations 20 || status=$?
          kill "$watcher" 2>/dev/null || true
          exit "$status"

  js:
    # Browser fixture tests for static/js/erp.js (ADR 0028; ENG-JS-01 spec section 9). Path-aware: on
    # a pull request, drafts included, the install and test steps run only when a relevant path
    # changed; pushes to main always run them. If the base is missing or the diff fails, the tests
    # run (fails closed). The Django fixture-contract and boundary tests run in the test job.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Relevant changes
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          relevant='^(static/(js|vendor|css)/|browser_tests/|requirements\.txt$|requirements-browser\.txt$|config/|manage\.py$|\.github/workflows/)'
          run=true
          if [ "$EVENT" = "pull_request" ] && [ -n "$BASE_SHA" ]; then
            if changed=$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA"); then
              grep -Eq "$relevant" <<< "$changed" || run=false
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "Browser tests run: $run" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@v5
        if: steps.paths.outputs.run == 'true'
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-browser.txt
      - name: Install Playwright
        if: steps.paths.outputs.run == 'true'
        run: pip install -r requirements-browser.txt
      - name: Cache headless Chromium
        id: browsers
        if: steps.paths.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements-browser.txt') }}-headless-shell
      - name: Install headless Chromium and system libraries
        if: steps.paths.outputs.run == 'true' && steps.browsers.outputs.cache-hit != 'true'
        run: python -m playwright install --with-deps --only-shell chromium
      - name: Install system libraries for the cached browser
        if: steps.paths.outputs.run == 'true' && steps.browsers.outputs.cache-hit == 'true'
        run: python -m playwright install-deps chromium
      # The step timeout is well inside the job's, so a hung run is stopped while the job can still
      # upload what the failing tests saved. A job killed by its own timeout uploads nothing.
      - name: Browser tests
        id: tests
        if: steps.paths.outputs.run == 'true'
        timeout-minutes: 5
        env:
          BT_ARTIFACT_DIR: ${{ runner.temp }}/bt-artifacts
        run: python -m unittest discover -s browser_tests -p "bt_*.py" -t .
      - name: Upload failure diagnostics (synthetic fixtures only)
        if: always() && steps.paths.outputs.run == 'true' && steps.tests.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-diagnostics
          path: ${{ runner.temp }}/bt-artifacts
          retention-days: 7
          if-no-files-found: ignore
