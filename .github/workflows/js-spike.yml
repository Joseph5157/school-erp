# TEMPORARY (ENG-JS-01 JS1 spike). Runs only on pushes to the spike branch. Deleted after the spike.
name: JS spike (temporary)

on:
  push:
    branches: [test/eng-js-01-js1]

permissions:
  contents: read

jobs:
  timing:
    # The proposed `js` job shape, measured on its own (spec section 9, condition 7).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-browser.txt
      - run: pip install -r requirements-browser.txt
      - name: Cache headless Chromium
        id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.64.1-headless-shell
      - name: Install headless Chromium and system libraries (cache miss)
        if: steps.browsers.outputs.cache-hit != 'true'
        run: python -m playwright install --with-deps --only-shell chromium
      - name: Install system libraries only (cache hit)
        if: steps.browsers.outputs.cache-hit == 'true'
        run: python -m playwright install-deps chromium
      - name: Browser tests
        run: python -m unittest discover -s browser_tests -p "bt_*.py" -t .

  reliability:
    # Ten consecutive runs (condition 5) and a forced failure that must upload diagnostics (condition 8).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-browser.txt
      - run: pip install -r requirements-browser.txt
      - run: python -m playwright install --with-deps --only-shell chromium
      - name: Ten consecutive runs
        run: |
          for i in $(seq 1 10); do
            start=$(date +%s.%N)
            python -m unittest discover -s browser_tests -p "bt_*.py" -t . 2> "run-$i.log" || { cat "run-$i.log"; exit 1; }
            end=$(date +%s.%N)
            echo "run $i: $(grep '^Ran' "run-$i.log") wall=$(python -c "print(round($end-$start,2))")s stderr_lines=$(wc -l < "run-$i.log")"
          done
      - name: Forced failure must fail and leave diagnostics
        env:
          BT_ARTIFACT_DIR: ${{ runner.temp }}/bt-artifacts
        run: |
          if BT_SPIKE_FORCE_FAIL=1 python -m unittest browser_tests.bt_spike.DiagnosticsSpike; then
            echo "expected a failure"; exit 1
          fi
          ls -la "$BT_ARTIFACT_DIR"
          test -n "$(ls "$BT_ARTIFACT_DIR"/*.png)" && test -n "$(ls "$BT_ARTIFACT_DIR"/*-trace.zip)"
      - name: Upload diagnostics (synthetic fixtures only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bt-diagnostics
          path: ${{ runner.temp }}/bt-artifacts
          retention-days: 7
          if-no-files-found: error
